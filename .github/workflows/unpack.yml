name: Preparar repositorio inicial

on:
  push:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir integración
        run: |
          unzip -q home-assistant-niba-v2.0.0.zip
          rm -rf home-assistant-niba/.github
          cp -a home-assistant-niba/. .
          rm -rf home-assistant-niba
          rm -f home-assistant-niba-v2.0.0.zip

      - name: Publicar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial release v2.0.0"
          git push
